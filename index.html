<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo - Color & Number Prediction</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <div class="brand-title">🎰 Dhani.win</div>
        <div class="balance-badge">₹<span id="balance-display">100.00</span></div>
    </div>

    <div class="mode-selector">
        <div class="mode-card active" onclick="switchMode(this, 30)">WinGo 30s</div>
        <div class="mode-card" onclick="switchMode(this, 60)">WinGo 1 Min</div>
        <div class="mode-card" onclick="switchMode(this, 180)">WinGo 3 Min</div>
        <div class="mode-card" onclick="switchMode(this, 300)">WinGo 5 Min</div>
    </div>

    <div class="timer-banner">
        <div class="timer-left">
            <div class="game-name" id="game-mode-name">WinGo 30sec</div>
            <div class="period-id" id="period-display">20260831100050754</div>
        </div>
        <div class="timer-right">
            <div class="timer-label">Time remaining</div>
            <div class="timer-clock">
                <span class="time-box" id="timer-min">0</span>
                <span class="time-box" id="timer-sec-1">3</span>
                <span class="time-box" id="timer-sec-2">0</span>
            </div>
        </div>
    </div>

    <div class="status-msg" id="status-msg">Select a color, number, or size to bet!</div>

    <div class="bet-section">
        <div class="color-btns">
            <button class="color-btn btn-green" onclick="placeBet('color', 'Green')">🟢 Green</button>
            <button class="color-btn btn-violet" onclick="placeBet('color', 'Violet')">🟣 Violet</button>
            <button class="color-btn btn-red" onclick="placeBet('color', 'Red')">🔴 Red</button>
        </div>

        <div class="number-grid">
            <div class="num-ball ball-0" onclick="placeBet('number', 0)">0</div>
            <div class="num-ball ball-green" onclick="placeBet('number', 1)">1</div>
            <div class="num-ball ball-red" onclick="placeBet('number', 2)">2</div>
            <div class="num-ball ball-green" onclick="placeBet('number', 3)">3</div>
            <div class="num-ball ball-red" onclick="placeBet('number', 4)">4</div>
            <div class="num-ball ball-5" onclick="placeBet('number', 5)">5</div>
            <div class="num-ball ball-red" onclick="placeBet('number', 6)">6</div>
            <div class="num-ball ball-green" onclick="placeBet('number', 7)">7</div>
            <div class="num-ball ball-red" onclick="placeBet('number', 8)">8</div>
            <div class="num-ball ball-green" onclick="placeBet('number', 9)">9</div>
        </div>

        <div class="multiplier-bar">
            <button class="mult-btn active" onclick="setMultiplier(1, this)">X1</button>
            <button class="mult-btn" onclick="setMultiplier(5, this)">X5</button>
            <button class="mult-btn" onclick="setMultiplier(10, this)">X10</button>
            <button class="mult-btn" onclick="setMultiplier(20, this)">X20</button>
            <button class="mult-btn" onclick="setMultiplier(50, this)">X50</button>
        </div>

        <div class="big-small-btns">
            <button class="bs-btn btn-big" onclick="placeBet('size', 'Big')">📈 Big</button>
            <button class="bs-btn btn-small" onclick="placeBet('size', 'Small')">📉 Small</button>
        </div>

        <button class="submit-bet-btn" onclick="submitBet()" id="submit-btn" disabled>Place Bet</button>
    </div>

    <div class="history-panel">
        <div class="history-title">📊 Game History</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Period</th>
                    <th>Number</th>
                    <th>Big/Small</th>
                    <th>Color</th>
                </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
        </table>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="navigateTo('index.html')">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="navigateTo('promo.html')">
            <span class="nav-icon">💰</span>
            <span>Promo</span>
        </div>
        <div class="nav-item" onclick="navigateTo('wheel.html')">
            <span class="nav-icon">🎡</span>
            <span>Wheel</span>
        </div>
        <div class="nav-item" onclick="navigateTo('earn.html')">
            <span class="nav-icon">👥</span>
            <span>Earn</span>
        </div>
        <div class="nav-item" onclick="navigateTo('profile.html')">
            <span class="nav-icon">👤</span>
            <span>Mine</span>
        </div>
    </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
